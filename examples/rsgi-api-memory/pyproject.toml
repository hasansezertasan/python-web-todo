[project]
name = "rsgi-api-memory"
version = "0.1.0"
description = "Todo JSON API as a bare RSGI app (Granian) with in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "granian>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
