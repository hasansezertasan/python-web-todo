[project]
name = "clastic-api-memory"
version = "0.1.0"
description = "Todo JSON API with Clastic and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clastic>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
