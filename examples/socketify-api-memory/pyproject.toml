[project]
name = "socketify-api-memory"
version = "0.1.0"
description = "Todo JSON API with socketify.py and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "socketify>=0.0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
