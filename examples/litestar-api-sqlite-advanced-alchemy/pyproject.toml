[project]
name = "litestar-api-sqlite-advanced-alchemy"
version = "0.1.0"
description = "Todo JSON API with Litestar, SQLite and advanced-alchemy storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litestar>=2.18",
    "advanced-alchemy>=1.11",
    "aiosqlite>=0.20",
    "msgspec>=0.18",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
