[project]
name = "circuits-api-memory"
version = "0.1.0"
description = "Todo JSON API with circuits.web and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "circuits>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
