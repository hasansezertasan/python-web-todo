[project]
name = "blacksheep-api-memory"
version = "0.1.0"
description = "Todo JSON API with BlackSheep and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "blacksheep>=2.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
