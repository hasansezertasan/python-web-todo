[project]
name = "wheezy-web-api-memory"
version = "0.1.0"
description = "Todo JSON API with wheezy.web and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wheezy.web>=3.2",
]

[dependency-groups]
dev = [
    "webtest>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
