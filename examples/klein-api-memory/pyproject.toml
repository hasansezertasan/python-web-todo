[project]
name = "klein-api-memory"
version = "0.1.0"
description = "Todo JSON API with Klein (Twisted micro-framework) and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "klein>=24.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
