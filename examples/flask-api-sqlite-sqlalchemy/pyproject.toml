[project]
name = "flask-api-sqlite-sqlalchemy"
version = "0.1.0"
description = "Todo JSON API with Flask, SQLite, and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
