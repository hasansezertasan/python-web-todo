[project]
name = "turbogears-ssr-memory"
version = "0.1.0"
description = "Server-rendered todo app with TurboGears, Genshi, and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "genshi>=0.7",
    "turbogears2>=2.5",
    "waitress>=2.1",
]

[project.scripts]
turbogears-ssr-memory = "app.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
