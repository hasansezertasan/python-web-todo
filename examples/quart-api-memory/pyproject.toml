[project]
name = "quart-api-memory"
version = "0.1.0"
description = "Todo JSON API with Quart and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "quart>=0.20",
    "hypercorn>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
