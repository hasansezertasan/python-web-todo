[project]
name = "baize-api-memory"
version = "0.1.0"
description = "Todo JSON API with Baize and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baize>=0.23",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
