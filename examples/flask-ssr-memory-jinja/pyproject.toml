[project]
name = "flask-ssr-memory-jinja"
version = "0.1.0"
description = "Server-rendered todo app with Flask, Jinja, and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
