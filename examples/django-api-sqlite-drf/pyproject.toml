[project]
name = "django-api-sqlite-drf"
version = "0.1.0"
description = "Todo JSON API with Django, Django REST framework and SQLite storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
