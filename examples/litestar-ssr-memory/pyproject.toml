[project]
name = "litestar-ssr-memory"
version = "0.1.0"
description = "Todo server-rendered app with Litestar, Jinja templates, and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "litestar>=2.24",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
