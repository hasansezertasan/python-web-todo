[project]
name = "tornado-api-memory"
version = "0.1.0"
description = "Todo JSON API with Tornado and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tornado>=6.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
