[project]
name = "connexion-api-memory"
version = "0.1.0"
description = "Todo JSON API with Connexion 3.x (OpenAPI-first) and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "connexion[uvicorn,swagger-ui]>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.force-include]
"src/app/openapi.yaml" = "app/openapi.yaml"
