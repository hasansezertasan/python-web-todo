[project]
name = "litestar-api-memory"
version = "0.1.0"
description = "Todo JSON API with Litestar and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litestar>=2,<3",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
