[project]
name = "tremolo-api-memory"
version = "0.1.0"
description = "Todo JSON API with Tremolo and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tremolo>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
