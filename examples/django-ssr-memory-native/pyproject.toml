[project]
name = "django-ssr-memory-native"
version = "0.1.0"
description = "Todo server-rendered app with Django templates and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config", "src/todos"]

[tool.hatch.build.targets.wheel.force-include]
"src/todos/templates" = "todos/templates"
