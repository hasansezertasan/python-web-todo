[project]
name = "flama-api-memory"
version = "0.1.0"
description = "Todo JSON API with Flama and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flama[pydantic]>=2.2",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
