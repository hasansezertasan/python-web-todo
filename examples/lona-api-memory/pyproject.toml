[project]
name = "lona-api-memory"
version = "0.1.0"
description = "Todo JSON API with Lona and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lona>=1.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
