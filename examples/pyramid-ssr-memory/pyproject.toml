[project]
name = "pyramid-ssr-memory"
version = "0.1.0"
description = "Server-rendered todo app with Pyramid, Chameleon, and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chameleon>=3.9",
    "pyramid>=2.0",
    "waitress>=2.1",
]

[project.scripts]
pyramid-ssr-memory = "app.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
