[project]
name = "falcon-api-memory"
version = "0.1.0"
description = "Todo JSON API with Falcon (WSGI) and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "falcon>=4.0",
    "gunicorn>=23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
