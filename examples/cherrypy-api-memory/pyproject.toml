[project]
name = "cherrypy-api-memory"
version = "0.1.0"
description = "Todo JSON API with CherryPy and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cherrypy>=18.8",
]

[dependency-groups]
dev = [
    "webtest>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
