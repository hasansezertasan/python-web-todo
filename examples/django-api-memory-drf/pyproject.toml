[project]
name = "django-api-memory-drf"
version = "0.1.0"
description = "Todo JSON API with Django + DRF and in-memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
