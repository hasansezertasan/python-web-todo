[project]
name = "sanic-api-memory"
version = "0.1.0"
description = "Todo JSON API with Sanic and in-memory storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sanic>=25.12",
    "sanic-testing>=24.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
