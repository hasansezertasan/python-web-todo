[project]
name = "python-web-todo"
version = "0.1.0"
description = "Todo app comparison across Python web frameworks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Dev group mirrors the frameworks covered by the shared contract suite so
# tests can import every example in one process. Pins match the examples.
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "fastapi>=0.115",
    "flask>=3.1",
    "sqlalchemy>=2.0",
    "django>=5.0",
    "djangorestframework>=3.15",
    "jinja2>=3.1",
    "litestar>=2",
    "advanced-alchemy>=1.11",
    "aiosqlite>=0.20",
    "starlette>=0.37",
    "muffin>=2.0",
    "connexion[uvicorn,swagger-ui]>=3.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
